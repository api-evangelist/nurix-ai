aid: nurix-ai
name: Nurix AI
description: 'Nurix AI is an enterprise conversational-AI company that builds human-like
  voice and chat AI agents for sales, customer support, and internal operations. Founded
  by Mukesh Bansal and backed by Accel and General Catalyst, Nurix delivers custom AI
  agents across voice, chat, email, SMS, and social channels through its NuPlay conversational-AI
  platform, NuStack workflow engine, and NuPulse conversation-analytics product. It serves
  30+ enterprises across retail, insurance, financial services, healthcare, and education,
  and offers enterprise-grade security controls (PII redaction, RBAC, SSO, audit trails,
  and regional data residency) with a HIPAA (BAA), DPA, and GDPR compliance posture. Nurix
  acquired the conversational-support platform Verloop.io. As of this profile the company
  publishes no public developer API, SDK, or documentation surface.'
